<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candlestick Flow</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#edf5ff;font:15px system-ui}header{padding:24px 4vw;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:21px}p{color:#aebdd3;margin:6px 0;font-size:13px}a{color:#bddcff}button,select,input[type=text]{background:#172b49;color:inherit;border:1px solid #456082;border-radius:7px;padding:9px;font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}canvas{display:block;width:100%;aspect-ratio:16/9;background:repeating-conic-gradient(#243147 0% 25%,#182337 0% 50%) 0/24px 24px}main{max-width:1600px;margin:auto}section{padding:22px 4vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}label{display:flex;align-items:center;gap:9px;min-height:36px}input[type=range]{width:100px;accent-color:#80dfff}input[type=color]{width:32px;height:32px;border:0;padding:0;background:none}input[type=text]{width:93px}output{font-variant-numeric:tabular-nums;font-size:13px}footer{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:8px 4vw 28px}*:focus-visible{outline:2px solid #80dfff;outline-offset:3px}</style>
<header><div><h1>Candlestick Flow</h1><p>Continuous candles · soft edge fading · abstract market motion</p></div><button id="play">Pause</button></header><main><canvas width="1920" height="1080" aria-label="Animated candlesticks flowing horizontally"></canvas></main>
<section aria-label="Animation properties">
<label>Speed <select id="speed"><option value=".5">0.5×</option><option selected>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select></label>
<label>Direction <select id="direction"><option value="1">Left → right</option><option value="-1">Right → left</option></select></label>
<label>Trend <select id="trend"><option value="0">Level</option><option value="1">Inclining</option><option value="-1">Declining</option></select></label>
<label>Candle width <input id="width" type="range" min="4" max="40" value="18"><output></output></label>
<label>Gap <input id="gap" type="range" min="4" max="48" value="12"><output></output></label>
<label>Chart height <input id="height" type="range" min="30" max="240" value="110"><output></output></label>
<label>Vertical position <input id="position" type="range" min="15" max="85" value="60"><output></output></label>
<label>Wick thickness <input id="wick" type="range" min="0.5" max="5" step="0.5" value="1"><output></output></label>
<label>Glow <input id="glow" type="range" min="0" max="20" value="5"><output></output></label>
<label>Edge fade <input id="fade" type="range" min="0" max="35" value="14"><output></output></label>
<label>Up <input id="upPicker" aria-label="Up candle color" type="color" value="#86e5ff"><input id="up" aria-label="Up candle hex" type="text" value="#86E5FF" maxlength="7"></label>
<label>Down <input id="downPicker" aria-label="Down candle color" type="color" value="#3675ef"><input id="down" aria-label="Down candle hex" type="text" value="#3675EF" maxlength="7"></label>
<label>Background <select id="background"><option value="gradient">Gradient</option><option value="solid">Solid</option><option value="transparent">Transparent</option></select></label>
<label>Start <input id="bg1Picker" aria-label="Background start color" type="color" value="#07152b"><input id="bg1" aria-label="Background start hex" type="text" value="#07152B" maxlength="7"></label>
<label>End <input id="bg2Picker" aria-label="Background end color" type="color" value="#123d88"><input id="bg2" aria-label="Background end hex" type="text" value="#123D88" maxlength="7"></label>
<label><input id="grid" type="checkbox">Grid <input id="gridColor" aria-label="Grid color" type="color" value="#597faa"></label>
</section><footer><button id="export">Export WebM · 1080p</button><span id="status" role="status"></span><a href="../flow-library/index.html">Flow library</a><p>8-second recording · current settings · transparent background supported</p></footer>
<script src="../flow-library/shared/portrait.js?v=candle-mp4"></script><script>
const $=id=>document.getElementById(id),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const valid=v=>/^#[0-9a-f]{6}$/i.test(v),num=id=>Number($(id).value),color=(id,f)=>valid($(id).value)?$(id).value:f;
let time=0,last=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches,recording=false;
function playLabel(){$('play').textContent=playing?'Pause':'Play'}playLabel();$('play').onclick=()=>{playing=!playing;playLabel()};
for(const id of ['up','down','bg1','bg2']){$(id+'Picker').oninput=()=>{$(id).value=$(id+'Picker').value.toUpperCase()};$(id).oninput=()=>{if(valid($(id).value))$(id+'Picker').value=$(id).value}};
for(const el of document.querySelectorAll('input[type=range]')){const update=()=>el.nextElementSibling.textContent=el.value+(['position','fade'].includes(el.id)?'%':['width','gap','wick','height'].includes(el.id)?' px':'');el.oninput=update;update()}
const mod=(v,n)=>((v%n)+n)%n;
function price(i){i=mod(i,180);return Math.sin(i*Math.PI/30)*.62+Math.sin(i*Math.PI/10+.7)*.27+Math.sin(i*Math.PI/3.6)*.19+Math.sin(i*Math.PI/1.8+.2)*.12}
function render(t){const W=1920,H=1080;ctx.clearRect(0,0,W,H);if($('background').value!=='transparent'&&(!window.flowPortraitCompositing||recording)){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,color('bg1','#07152B'));g.addColorStop(1,$('background').value==='solid'?color('bg1','#07152B'):color('bg2','#123D88'));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}if($('grid').checked){ctx.save();ctx.globalAlpha=.14;ctx.strokeStyle=$('gridColor').value;ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x+=96){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y+=90){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.restore()}
const cw=num('width'),step=cw+num('gap'),shift=t*38*num('direction'),base=-Math.floor(shift/step),offset=mod(shift,step),height=num('height'),fade=num('fade')/100*W;
for(let k=-2;k<W/step+2;k++){const i=base+k,x=k*step+offset,center=H*num('position')/100-num('trend')*(x/W-.5)*300;const open=center-price(i)*height,close=center-price(i+1)*height,top=Math.min(open,close),bottom=Math.max(open,close),wick=(12+14*(.5+.5*Math.sin(i*1.7)))*height/110;const opacity=fade===0?1:Math.max(0,Math.min(1,x/fade,(W-x)/fade));const c=close<open?color('up','#86E5FF'):color('down','#3675EF');ctx.save();ctx.globalAlpha=opacity;ctx.strokeStyle=c;ctx.lineWidth=num('wick');ctx.globalAlpha=opacity*.5;ctx.beginPath();ctx.moveTo(x,top-wick);ctx.lineTo(x,bottom+wick);ctx.stroke();ctx.globalAlpha=opacity*.9;ctx.fillStyle=c;ctx.shadowBlur=num('glow');ctx.shadowColor=c;ctx.fillRect(x-cw/2,top,cw,Math.max(3,bottom-top));ctx.restore()}}
function frame(now){if(last&&playing&&!document.hidden)time+=Math.min((now-last)/1000,.05)*num('speed');last=now;render(time);requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('export').onclick=async()=>{const btn=$('export'),status=$('status');if(!window.MediaRecorder||!canvas.captureStream){status.textContent='Video recording is not supported in this browser.';return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status.textContent='WebM recording is not supported in this browser.';return}const wasPlaying=playing;let stream,rec,timer;try{btn.disabled=true;recording=true;playing=true;playLabel();$('play').disabled=true;document.querySelectorAll('section input,section select').forEach(e=>e.disabled=true);stream=canvas.captureStream(60);rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:20000000});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=reject});rec.start();let left=8;status.textContent='Recording 8s — keep this tab visible';timer=setInterval(()=>{left--;status.textContent='Recording '+left+'s — keep this tab visible';if(left<=0){clearInterval(timer);rec.stop()}},1000);await done;const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=url;a.download='candlestick-flow.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Export complete'}catch(e){status.textContent='Could not export: '+e.message}finally{clearInterval(timer);if(rec&&rec.state!=='inactive')rec.stop();stream?.getTracks().forEach(t=>t.stop());playing=wasPlaying;recording=false;playLabel();btn.disabled=false;$('play').disabled=false;document.querySelectorAll('section input,section select').forEach(e=>e.disabled=false)}};
</script></html>
