<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light stream · motion study</title><style>
*{box-sizing:border-box}body{margin:0;background:#071327;color:#eff5ff;font:15px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 5vw}h1{font-size:18px;font-weight:550;margin:0}p{color:#9aafcc;margin:6px 0 0;font-size:13px}.stage{width:min(1200px,100%);margin:0 auto;aspect-ratio:1280/720;display:grid;place-items:center}canvas{width:100%;height:100%;display:block}footer{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:20px}button,select{background:#142642;border:1px solid #385071;border-radius:8px;color:inherit;padding:10px 16px;font:inherit}label{display:flex;align-items:center;gap:12px}input{accent-color:#6397ff;width:140px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #98bbff;outline-offset:4px}@media(max-width:600px){header{padding:24px}footer{gap:16px}}
</style><header><div><h1>Light stream</h1><p>Five fixed curves · highlights travel left to right</p></div><button id="pause">Pause</button></header><main class="stage"><canvas id="ribbon" aria-label="Five light trails with moving highlights"></canvas></main><footer><a id="mp4" href="light-stream-custom.mp4" download style="color:inherit">Export MP4</a><a id="webm" href="light-stream-custom.webm" download style="color:inherit">Export WebM</a><label><input id="mirror" type="checkbox" style="width:auto">Mirror horizontally</label><label><input id="reverse" type="checkbox" style="width:auto">Reverse flow</label><label>Flow <input id="strength" aria-label="Flow intensity" type="range" min="0" max="1.8" step="0.05" value="1"></label><label>Background <select id="backdrop"><option value="solid">Solid</option><option value="gradient" selected>Gradient</option><option value="transparent">Transparent</option></select></label><label>Color <input id="color1" aria-label="Background hex" type="text" value="#1859DF" pattern="#[0-9a-fA-F]{6}" style="width:95px"></label><label>Gradient end <input id="color2" aria-label="Gradient end hex" type="text" value="#9FC6FC" pattern="#[0-9a-fA-F]{6}" style="width:95px"></label><label>Speed <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><span id="status" role="status"></span></footer><script src="flow-library/shared/portrait.js?v=custom1"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');canvas.width=1280;canvas.height=720;
const $=id=>document.getElementById(id);let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=0,exporting=false;
$('pause').textContent=playing?'Pause':'Play';$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'Pause':'Play'};
function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255)}
function background(){let a=$('color1').value,b=$('color2').value;if(!/^#[0-9a-f]{6}$/i.test(a)||!/^#[0-9a-f]{6}$/i.test(b))return;document.querySelector('.stage').style.background=$('backdrop').value==='gradient'?'linear-gradient('+a+','+b+')':$('backdrop').value==='transparent'?'repeating-conic-gradient(#243147 0% 25%,#182337 0% 50%) 0/24px 24px':a}
for(const id of ['backdrop','color1','color2'])$(id).oninput=background;background();
const W=1280,H=720,coverage=new Float32Array(W*H),distances=[];
for(let i=0;i<5;i++){let d=new Float32Array(W*H);for(let x=0;x<W;x++){let u=(x+.5)/W,p=.735+.035*i+.065*Math.sin(u*4.4)-(.17-.055*i)*u*u;for(let y=0;y<H;y++)d[y*W+x]=Math.abs((y+.5)/H-p)*H}distances.push(d)}
const frame=ctx.createImageData(W,H);
function render(now){if(last&&playing&&!document.hidden)time+=Math.min((now-last)/1000,.1)*+$('speed').value;last=now;coverage.fill(0);const phase=time/6*($('reverse').checked?-1:1),strength=+$('strength').value;
for(let i=0;i<5;i++){let head=(((phase+i*.23)%1+1)%1)*1.5-.25,d=distances[i];for(let x=0;x<W;x++){let delta=head-(x+.5)/W,pulse=Math.exp(-(Math.max(delta,0)**2)/.011-(Math.min(delta,0)**2)/.00015);for(let y=0;y<H;y++){let k=y*W+x,dd=d[k]*d[k];if(dd>800)continue;let light=Math.min(1,Math.exp(-dd/1.2)*.52+strength*pulse*(Math.exp(-dd/4)*.8+Math.exp(-dd/90)*.24));coverage[k]=1-(1-coverage[k])*(1-light)}}}
const mirror=$('mirror').checked;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let k=(y*W+x)*4,v=coverage[y*W+(mirror?W-1-x:x)];frame.data[k]=212;frame.data[k+1]=245;frame.data[k+2]=255;frame.data[k+3]=Math.round(v*255)}ctx.putImageData(frame,0,0);requestAnimationFrame(render)}requestAnimationFrame(render);
for(const format of ['mp4','webm'])$(format).onclick=async e=>{e.preventDefault();if(exporting)return;let color1=$('color1').value,color2=$('color2').value;if(!/^#[0-9a-f]{6}$/i.test(color1)||!/^#[0-9a-f]{6}$/i.test(color2)){$('status').textContent='Enter hex colors like #184CD0';return}exporting=true;$('status').textContent='Rendering '+format.toUpperCase()+'…';try{let r=await fetch('/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format,color1,color2,background:$('backdrop').value,mirror:$('mirror').checked,reverse:$('reverse').checked,strength:+$('strength').value,speed:+$('speed').value})});if(!r.ok)throw Error();let url=URL.createObjectURL(await r.blob()),link=document.createElement('a');link.href=url;link.download='light-stream.'+format;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('status').textContent='Export ready'}catch{$('status').textContent='Export failed; use the local preview on port 8044.'}finally{exporting=false}};
</script></html>
