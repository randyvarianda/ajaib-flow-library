<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow studies</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#eef6ff;font:15px system-ui}header,footer{padding:22px 4vw;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:20px;margin:0}p{color:#acbed8;margin:5px 0;font-size:13px}canvas{display:block;width:100%;aspect-ratio:16/9;background:linear-gradient(#1859df,#9fc6fc)}button,select,input{font:inherit;color:inherit;background:#172b49;border:1px solid #456082;border-radius:6px;padding:9px}label{display:flex;gap:8px;align-items:center}a{color:#b9d8ff}input[type=range]{padding:0;width:120px}main{max-width:1600px;margin:auto}</style><header><div><h1>Standalone flow studies</h1><p>Left to right · no text or objects in the animation</p></div><button id="play">Pause</button></header><main><canvas width="1440" height="810" aria-label="Abstract flow animation"></canvas></main><footer><label>Direction <select id="style"><option value="aperture">01 · Traveling apertures</option><option value="tide">02 · Glass tide</option><option value="planes">03 · Sliding planes</option><option value="beam">04 · Soft light sweep</option></select></label><label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select>×</label><label>Intensity <input id="strength" type="range" min="0.2" max="1" step="0.05" value="0.8"></label><label>Background <select id="bg"><option value="blue">Blue gradient</option><option value="dark">Midnight</option><option value="clear">Transparent</option></select></label><a href="../flow-library/index.html">Flow library</a></footer><script src="../flow-library/shared/portrait.js?v=preview3"></script><script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),$=x=>document.getElementById(x);let t=0,last=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches;const q=new URLSearchParams(location.search);if(['aperture','tide','planes','beam'].includes(q.get('style'))) $('style').value=q.get('style');$('play').textContent=playing?'Pause':'Play';$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};$('bg').onchange=()=>canvas.style.background=$('bg').value==='blue'?'linear-gradient(#1859df,#9fc6fc)':$('bg').value==='dark'?'#071327':'repeating-conic-gradient(#243147 0% 25%,#182337 0% 50%) 0/24px 24px';$('style').onchange=()=>history.replaceState(null,'','?style='+$('style').value);
function path(x,offset){return 470+offset+70*Math.sin(x/420)}
function frame(now){if(last&&playing&&!document.hidden)t+=Math.min((now-last)/1000,.05)*+$('speed').value;last=now;c.clearRect(0,0,1440,810);c.globalAlpha=+$('strength').value;let mode=$('style').value;
if(mode==='aperture'){for(let i=0;i<5;i++){let p=((t/9+i/5)%1),x=-350+p*2140,fade=Math.sin(Math.PI*p);c.save();c.translate(x,420);c.rotate(-.18);let g=c.createLinearGradient(-190,0,190,0);g.addColorStop(0,'rgba(160,220,255,0)');g.addColorStop(.65,'rgba(190,240,255,.12)');g.addColorStop(1,'rgba(235,255,255,.8)');c.strokeStyle=g;c.globalAlpha=fade*+$('strength').value;c.lineWidth=2;c.beginPath();c.ellipse(0,0,175,260,0,0,Math.PI*2);c.stroke();c.shadowBlur=18;c.shadowColor='#b4f9ff';c.beginPath();c.ellipse(0,0,181,267,0,-.65,.55);c.stroke();c.restore()}}
if(mode==='tide'){for(let j=0;j<4;j++){let offset=j*38;let g=c.createLinearGradient(0,330,0,700);g.addColorStop(0,'rgba(220,250,255,.05)');g.addColorStop(.6,'rgba(190,235,255,.12)');g.addColorStop(1,'rgba(30,90,200,0)');c.fillStyle=g;c.beginPath();for(let x=-10;x<=1450;x+=8){let y=path(x,offset);x===-10?c.moveTo(x,y):c.lineTo(x,y)}for(let x=1450;x>=-10;x-=8)c.lineTo(x,path(x,offset)+65);c.closePath();c.fill();c.strokeStyle='rgba(210,248,255,.2)';c.lineWidth=1;c.beginPath();for(let x=-10;x<=1450;x+=8)c.lineTo(x,path(x,offset));c.stroke();let head=((t/6+j*.24)%1)*1840-200;for(let k=0;k<80;k++){let x=head-k*3,opacity=(1-k/80)*.6;c.strokeStyle=`rgba(215,255,255,${opacity})`;c.lineWidth=2;c.beginPath();c.moveTo(x,path(x,offset));c.lineTo(x+4,path(x+4,offset));c.stroke()}}}
if(mode==='planes'){for(let i=0;i<4;i++){let p=(t/8+i*.25)%1,x=-500+p*2440;c.save();c.translate(x,400);c.transform(1,0,-.6,1,0,0);let g=c.createLinearGradient(-280,0,0,0);g.addColorStop(0,'rgba(180,235,255,0)');g.addColorStop(.85,'rgba(180,235,255,.06)');g.addColorStop(1,'rgba(220,255,255,.32)');c.fillStyle=g;c.fillRect(-280,-235,280,470);c.strokeStyle='rgba(220,255,255,.55)';c.lineWidth=1.5;c.beginPath();c.moveTo(0,-235);c.lineTo(0,235);c.stroke();c.restore()}}
if(mode==='beam'){for(let i=0;i<3;i++){let p=(t/7+i/3)%1,x=-600+p*2640;c.save();c.translate(x,405);c.rotate(-.3);let g=c.createLinearGradient(-400,0,120,0);g.addColorStop(0,'rgba(180,230,255,0)');g.addColorStop(.75,'rgba(180,230,255,.03)');g.addColorStop(.94,'rgba(210,250,255,.23)');g.addColorStop(1,'rgba(210,250,255,0)');c.fillStyle=g;c.fillRect(-400,-750,520,1500);c.restore()}}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
