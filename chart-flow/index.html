<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart Flow · Motion library</title><style>*{box-sizing:border-box}body{margin:0;background:#091324;color:#edf5ff;font:15px system-ui}header,footer{padding:22px 4vw;display:flex;align-items:center;gap:18px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:20px;margin:0}p{font-size:13px;color:#a7bad5;margin:6px 0}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9}button,select,input[type=text]{font:inherit;background:#172b49;color:inherit;border:1px solid #405b80;border-radius:7px;padding:9px}label{display:flex;align-items:center;gap:8px}input[type=text]{width:100px}input[type=color]{width:36px;height:34px;border:0;background:none}a{color:#b6d8ff}footer{justify-content:center}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #a9efff;outline-offset:3px}</style><header><div><h1>Chart Flow</h1><p id="description">New points appear on the right; history scrolls left.</p></div><button id="play">Pause</button></header><main><canvas width="1440" height="810" aria-label="Abstract chart animation without labels or trading data"></canvas></main><footer><label>Mode <select id="mode"><option value="scroll">Scrolling chart</option><option value="fixed">Fixed chart · light flow</option></select></label><label><input id="incline" type="checkbox">Inclining trend</label><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><label>Line <input id="color" type="color" value="#80e7ff"><input id="hex" aria-label="Line color hex" type="text" value="#80E7FF" maxlength="7"></label><label>Background <select id="bg"><option value="gradient">Gradient</option><option value="solid">Solid</option><option value="transparent">Transparent</option></select></label><input id="bg1" aria-label="Background start hex" type="text" value="#071425" maxlength="7"><input id="bg2" aria-label="Background end hex" type="text" value="#163C65" maxlength="7"><label><input id="grid" type="checkbox" checked>Grid</label><label>Grid color <input id="gridColor" aria-label="Grid color" type="color" value="#A0C8F5"></label><label><input id="fill" type="checkbox" checked>Area fill</label><label>Export quality <select id="resolution"><option value="1920">1080p · High</option><option value="2560">1440p · Ultra</option></select></label><label>FPS <select id="fps"><option value="60">60 fps</option><option value="30">30 fps</option></select></label><button id="mp4">Export MP4</button><button id="webm">Export WebM</button><span id="status" role="status"></span><a href="../flow-library/index.html">Flow library</a></footer><script src="../flow-library/shared/portrait.js?v=wide1"></script><script>
const $=id=>document.getElementById(id),canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let t=0,last=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches;const valid=s=>/^#[0-9a-f]{6}$/i.test(s),rgb=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));let color=[128,231,255],start='#071425',end='#163C65';
function sync(){ $('description').textContent=$('mode').value==='scroll'?'New points appear on the right; history scrolls left.':'The chart stays fixed; highlights travel left to right.';const query=new URLSearchParams(location.search);query.set('mode',$('mode').value);history.replaceState(null,'','?'+query)}let initial=new URLSearchParams(location.search).get('mode');if(initial==='fixed')$('mode').value=initial;sync();$('mode').onchange=sync;$('play').textContent=playing?'Pause':'Play';$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};$('color').oninput=e=>{$('hex').value=e.target.value.toUpperCase();color=rgb(e.target.value)};$('hex').oninput=e=>{if(valid(e.target.value)){color=rgb(e.target.value);$('color').value=e.target.value}};for(let id of ['bg1','bg2'])$(id).oninput=e=>{if(valid(e.target.value)){if(id==='bg1')start=e.target.value;else end=e.target.value}};
const count=120,values=Array.from({length:count},(_,i)=>480+58*Math.sin(i*Math.PI*2/count*3)+27*Math.sin(i*Math.PI*2/count*11+.8)+17*Math.sin(i*Math.PI*2/count*23));
function curve(u){let index=((u%count)+count)%count,k=Math.floor(index),f=index-k;return values[k]*(1-f)+values[(k+1)%count]*f}
function chartY(x,offset=0){return curve(x/24+offset)-($('incline').checked?x*.12-80:0)}
function frame(now){if(last&&playing&&!document.hidden)t+=Math.min((now-last)/1000,.06)*+$('speed').value;last=now;c.clearRect(0,0,1440,810);let background=$('bg').value;if(background!=='transparent'&&!window.flowPortraitCompositing){let g=c.createLinearGradient(0,0,0,810);g.addColorStop(0,start);g.addColorStop(1,background==='solid'?start:end);c.fillStyle=g;c.fillRect(0,0,1440,810);canvas.style.background='none'}else canvas.style.background='repeating-conic-gradient(#203047 0% 25%,#142036 0% 50%) 0/24px 24px';
if($('grid').checked){c.strokeStyle=`rgba(${rgb($('gridColor').value)},.08)`;c.lineWidth=1;c.beginPath();for(let x=0;x<=1440;x+=80){c.moveTo(x,310);c.lineTo(x,750)}for(let y=350;y<=750;y+=80){c.moveTo(0,y);c.lineTo(1440,y)}c.stroke()}
const scroll=$('mode').value==='scroll',offset=scroll?(t/12*count)%count:0,right=1440,points=[];for(let x=-20;x<=right;x+=4)points.push([x,chartY(x,offset)]);let stroke=`rgb(${color})`;
if($('fill').checked){let g=c.createLinearGradient(0,350,0,760);g.addColorStop(0,`rgba(${color},.20)`);g.addColorStop(1,`rgba(${color},0)`);c.fillStyle=g;c.beginPath();c.moveTo(points[0][0],760);for(let p of points)c.lineTo(...p);c.lineTo(right,760);c.closePath();c.fill()}
c.strokeStyle=stroke;c.globalAlpha=scroll?.85:.4;c.lineWidth=2;c.lineJoin='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.globalAlpha=1;
if(scroll){let y=chartY(right,offset);c.fillStyle=stroke;c.shadowColor=stroke;c.shadowBlur=15;c.beginPath();c.arc(right,y,4,0,Math.PI*2);c.fill();c.shadowBlur=0}else{for(let j=0;j<2;j++){let head=((t/6+j*.5)%1)*1840-200;for(let k=0;k<70;k++){let x=head-k*3;if(x<0||x>1440)continue;c.strokeStyle=`rgba(${color},${(1-k/70)*.95})`;c.lineWidth=3;c.beginPath();c.moveTo(x,chartY(x));c.lineTo(x+3,chartY(x+3));c.stroke()}}}
requestAnimationFrame(frame)}requestAnimationFrame(frame);

let exporting=false;for(const format of ['mp4','webm'])$(format).onclick=async()=>{if(exporting)return;if(!valid($('hex').value)||!valid($('bg1').value)||!valid($('bg2').value)){$('status').textContent='Enter valid hex colors';return}exporting=true;$('mp4').disabled=$('webm').disabled=true;$('status').textContent='Rendering…';try{const res=await fetch('/export-chart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format,resolution:+$('resolution').value,fps:+$('fps').value,mode:$('mode').value,speed:+$('speed').value,incline:$('incline').checked,color:$('hex').value,grid:$('grid').checked,gridColor:$('gridColor').value,fill:$('fill').checked,background:$('bg').value,bg1:$('bg1').value,bg2:$('bg2').value})});if(!res.ok)throw Error();let url=URL.createObjectURL(await res.blob()),link=document.createElement('a');link.href=url;link.download='chart-flow.'+format;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('status').textContent='Export ready'}catch{$('status').textContent='Open the export preview on port 8046 and try again.'}finally{exporting=false;$('mp4').disabled=$('webm').disabled=false}};
</script></html>
