<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dot Current · Flow study</title><style>*{box-sizing:border-box}body{margin:0;background:#091324;color:#edf5ff;font:15px system-ui}header,footer{padding:22px 4vw;display:flex;align-items:center;gap:22px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:20px;margin:0}p{font-size:13px;color:#9fb3cf;margin:6px 0}main{max-width:1600px;margin:auto}canvas{width:100%;aspect-ratio:16/9;display:block}button,select{background:#172b49;color:inherit;font:inherit;border:1px solid #405b80;border-radius:7px;padding:9px 12px}label{display:flex;align-items:center;gap:10px}input{accent-color:#70dfff;width:110px}input[type=text]{background:#172b49;color:inherit;border:1px solid #405b80;border-radius:6px;padding:8px;width:100px}a{color:#b6d8ff}footer{justify-content:center}</style><header><div><h1>Dot Current</h1><p>Fixed grid · coherent light clusters · two-way flow</p></div><button id="play">Pause</button></header><main><canvas width="1440" height="810" aria-label="Square dot field with light clusters flowing left and right"></canvas></main><footer><label>Flow <select id="direction"><option value="split">Two-way</option><option value="right">Left → right</option><option value="left">Right → left</option></select></label><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><label>Intensity <input type="range" min=".2" max="1" step=".05" value=".9" id="intensity"></label><label>Dot color <input id="dotColor" type="color" value="#82dfff" aria-label="Dot color" style="width:42px;height:34px"><input id="dotHex" type="text" value="#82DFFF" aria-label="Dot color hex" maxlength="7" style="width:95px;background:#172b49;color:inherit;border:1px solid #405b80;border-radius:6px;padding:8px"></label><label>Backdrop <select id="bg"><option value="dark">Midnight</option><option value="blue">Ajaib blue</option><option value="solid">Custom solid</option><option value="gradient">Custom gradient</option><option value="transparent">Transparent</option></select></label><label>Background hex <input id="bgHex" aria-label="Background hex" type="text" value="#184CD0" maxlength="7"></label><label>Gradient end <input id="bgEnd" aria-label="Gradient end hex" type="text" value="#82B2F5" maxlength="7"></label><button id="mp4">Export MP4</button><button id="webm">Export WebM</button><span id="status" role="status"></span><a href="../flow-library/index.html">Flow library</a></footer><script src="../flow-library/shared/portrait.js?v=preview3"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let t=0,last=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches;$('play').textContent=playing?'Pause':'Play';$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
let dotRGB=[130,223,255];function setColor(hex){if(!/^#[0-9a-f]{6}$/i.test(hex))return;dotRGB=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));$('dotColor').value=hex;$('dotHex').value=hex.toUpperCase();$('dotHex').setAttribute('aria-invalid','false')} $('dotColor').oninput=e=>setColor(e.target.value);$('dotHex').oninput=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value))setColor(e.target.value);else e.target.setAttribute('aria-invalid','true')};
const dots=[];for(let x=-12;x<=1452;x+=30){let u=x/1440,center=650-260*u+40*Math.sin(u*5),width=105+45*u;for(let y=150;y<=810;y+=30){let v=(y-center)/width;if(Math.abs(v)>1)continue;dots.push({x,y,u,v})}}
function draw(now){if(last&&playing&&!document.hidden)t+=Math.min((now-last)/1000,.05)*+$('speed').value;last=now;ctx.clearRect(0,0,1440,810);let bg=$('bg').value;if(bg!=='transparent'&&!window.flowPortraitCompositing){let g=ctx.createLinearGradient(0,0,0,810);const valid=v=>/^#[0-9a-f]{6}$/i.test(v),start=valid($('bgHex').value)?$('bgHex').value:'#184CD0',end=valid($('bgEnd').value)?$('bgEnd').value:'#82B2F5';g.addColorStop(0,bg==='solid'||bg==='gradient'?start:bg==='blue'?'#184CD0':'#071425');g.addColorStop(1,bg==='solid'?start:bg==='gradient'?end:bg==='blue'?'#82B2F5':'#102b46');ctx.fillStyle=g;ctx.fillRect(0,0,1440,810)}else{canvas.style.background='repeating-conic-gradient(#243147 0% 25%,#182337 0% 50%) 0/24px 24px'}let strength=+$('intensity').value,mode=$('direction').value;for(let d of dots){let sign=mode==='right'?1:mode==='left'?-1:d.v<0?1:-1;let p=d.u-sign*t/6+d.v*.085;let cycle=((p%1)+1)%1;let distance=Math.min(cycle,1-cycle);let pulse=Math.exp(-distance*distance/.013);let edge=Math.min(1,(1-Math.abs(d.v))*4);let brightness=.12+pulse*.88*strength;ctx.fillStyle=`rgba(${dotRGB[0]},${dotRGB[1]},${dotRGB[2]},${brightness*edge})`;ctx.fillRect(d.x-4,d.y-4,8,8)}requestAnimationFrame(draw)}requestAnimationFrame(draw);

const saved=new URLSearchParams(location.search);for(const id of ['direction','speed','intensity','bg','bgHex','bgEnd'])if(saved.has(id))$(id).value=saved.get(id);if(saved.has('dotHex'))setColor(saved.get('dotHex'));let exporting=false;for(const format of ['mp4','webm'])$(format).onclick=async()=>{if(exporting)return;if(!/^#[0-9a-f]{6}$/i.test($('bgHex').value)||!/^#[0-9a-f]{6}$/i.test($('bgEnd').value)){$('status').textContent='Enter valid background hex colors';return}if(!/^#[0-9a-f]{6}$/i.test($('dotHex').value)){$('status').textContent='Enter a valid hex color';return}if(false){const q=new URLSearchParams();for(const id of ['direction','speed','intensity','bg','bgHex','bgEnd','dotHex'])q.set(id,$(id).value);location.href='/dot-current/index.html?'+q;return}exporting=true;$('mp4').disabled=$('webm').disabled=true;$('status').textContent='Rendering '+format.toUpperCase()+'…';try{let res=await fetch('/export-dots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format,color:$('dotHex').value,direction:$('direction').value,speed:+$('speed').value,intensity:+$('intensity').value,background:$('bg').value,color1:$('bgHex').value,color2:$('bgEnd').value})});if(!res.ok)throw Error();let url=URL.createObjectURL(await res.blob()),a=document.createElement('a');a.href=url;a.download='dot-current.'+format;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('status').textContent='Export ready'+(format==='mp4'&&$('bg').value==='transparent'?' · MP4 uses midnight background':'')}catch{$('status').textContent='Export failed. Please try again.'}finally{exporting=false;$('mp4').disabled=$('webm').disabled=false}};
</script></html>
