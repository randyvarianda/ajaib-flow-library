<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tapered Current</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#eef6ff;font:15px system-ui}header,footer{padding:22px 4vw;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:20px;margin:0}p{font-size:13px;color:#aebfd7;margin:6px 0}main{max-width:1600px;margin:auto}canvas{width:100%;aspect-ratio:1672/941;display:block;background:#184cd0}button,select{font:inherit;color:inherit;background:#172b49;border:1px solid #456082;border-radius:6px;padding:9px}label{display:flex;gap:8px;align-items:center}a{color:#b9d8ff}input{accent-color:#67dfff}footer{justify-content:center}</style><header><div><h1>Tapered Current</h1><p>Fixed silhouette · left-to-right surface light</p></div><button id="play">Pause</button></header><main><canvas aria-label="Tapered blue current with moving highlights"></canvas></main><footer><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><label>Intensity <input id="intensity" type="range" min="0" max="2" step=".05" value="1"></label><label><input id="reverse" type="checkbox">Reverse flow</label><label><input id="mirror" type="checkbox">Mirror</label><a href="../flow-library/index.html">Flow library</a></footer><script src="../flow-library/shared/portrait.js?v=custom1"></script><script>
const $=id=>document.getElementById(id),canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:false,antialias:false});
const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=p;gl_Position=vec4(p.x*2.-1.,1.-p.y*2.,0.,1.);}`;
const fs=`precision highp float;varying vec2 uv;uniform sampler2D tex;uniform float phase;uniform float intensity;uniform float mirror;
void main(){vec2 pos=vec2(mirror>.5?1.-uv.x:uv.x,uv.y);vec3 c=texture2D(tex,pos).rgb;
float saturation=max(c.b-c.r,0.);float band=smoothstep(.545,.588,pos.y)*(1.-smoothstep(.68,.715,pos.y));
float mask=band*smoothstep(.20,.45,saturation)*smoothstep(.04,.15,pos.x)*(1.-smoothstep(.87,.95,pos.x));
float across=(pos.y-.632)*16.;float wave=pos.x*12.5663706-phase;
float pulse=pow(.5+.5*cos(wave+across*.7),9.);
float dark=.09*sin(wave+across*.7);vec3 light=vec3(.13,.35,.4)*pulse;
gl_FragColor=vec4(clamp(c+mask*intensity*(light-c*dark),0.,1.),1.);}`;
function shader(type,s){let o=gl.createShader(type);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
let program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,0,1,1,0,1,1]),gl.STATIC_DRAW);let p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);let phase=gl.getUniformLocation(program,'phase'),intensity=gl.getUniformLocation(program,'intensity'),mirror=gl.getUniformLocation(program,'mirror');let ready=false,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches,t=0,last=0;
$('play').textContent=playing?'Pause':'Play';$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
let img=new Image();img.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());for(let param of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,param,gl.CLAMP_TO_EDGE);for(let param of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,param,gl.LINEAR);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);ready=true};img.src='visual.png';
function frame(now){if(last&&playing&&!document.hidden)t+=Math.min((now-last)/1000,.05)*+$('speed').value;last=now;let w=Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)),h=Math.round(w*941/1672);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}if(ready){gl.uniform1f(phase,t/5*Math.PI*2*($('reverse').checked?-1:1));gl.uniform1f(intensity,+$('intensity').value);gl.uniform1f(mirror,$('mirror').checked?1:0);gl.drawArrays(gl.TRIANGLES,0,6)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
