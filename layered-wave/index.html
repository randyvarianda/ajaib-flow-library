<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layered Wave Field</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#edf5ff;font:15px system-ui}header,footer{padding:22px 4vw;display:flex;align-items:center;gap:18px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:20px;margin:0}p{font-size:13px;color:#adc0d9;margin:6px 0}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9}button,select,input[type=text]{font:inherit;background:#172b49;color:inherit;border:1px solid #456082;border-radius:7px;padding:9px}input[type=text]{width:100px}input[type=range]{width:105px;accent-color:#80dfff}input[type=color]{width:36px;height:34px;padding:0;border:0;background:none}output{min-width:38px;font-variant-numeric:tabular-nums}label{display:flex;align-items:center;gap:8px}footer{justify-content:center}a{color:#bddcff}</style><header><div><h1>Layered Wave Field</h1><p>Seamless cycles · speed snaps to whole loops within the selected export duration</p></div><button id="play">Pause</button></header><main><canvas width="1600" height="900" aria-label="Layered blue wave field with traveling light points"></canvas></main><footer><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><label>Lines <input id="density" type="range" min="8" max="40" value="28" step="1"></label><label>Position X <input id="positionX" aria-label="Horizontal position" type="range" min="-100" max="100" step="1" value="0"><output id="positionXValue">0%</output></label><label>Position Y <input id="positionY" aria-label="Vertical position" type="range" min="-100" max="100" step="1" value="0"><output id="positionYValue">0%</output></label><button id="resetPosition">Reset position</button><label>Rotation <input id="rotation" aria-label="Wave rotation" type="range" min="-180" max="180" step="1" value="0"><output id="rotationValue">0°</output></label><label>Spacing <input id="gap" aria-label="Wave spacing" type="range" min="0.2" max="3" step="0.05" value="1"><output id="gapValue">1×</output></label><label>Wave height <input id="height" aria-label="Wave height" type="range" min="0" max="2" step=".05" value="1"></label><label>Glow <input id="glow" aria-label="Glow strength" type="range" min="0" max="2" step=".05" value=".7"></label><label>Thickness <input id="thickness" aria-label="Line thickness" type="range" min="0.5" max="8" step="0.1" value="2"><output id="thicknessValue">2 px</output></label><label>Line <input id="colorPicker" aria-label="Line color picker" type="color" value="#187bdf"><input id="color" type="text" value="#187BDF" maxlength="7"></label><label>Highlight <input id="highlightPicker" aria-label="Highlight color picker" type="color" value="#38e6f2"><input id="highlight" type="text" value="#38E6F2" maxlength="7"></label><label>Background <select id="bg"><option value="gradient">Gradient</option><option value="solid">Solid</option><option value="transparent">Transparent</option></select></label><input id="bg1Picker" aria-label="Background start color picker" type="color" value="#02152e"><input id="bg1" aria-label="Background start hex" type="text" value="#02152E" maxlength="7"><input id="bg2Picker" aria-label="Background end color picker" type="color" value="#032342"><input id="bg2" aria-label="Background end hex" type="text" value="#032342" maxlength="7"><label><input id="reverse" type="checkbox">Reverse</label><label><input id="mirror" type="checkbox">Mirror</label><a href="../flow-library/index.html">Flow library</a></footer><script src="../flow-library/shared/portrait.js?v=render2"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let t=0,last=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches;const valid=s=>/^#[0-9a-f]{6}$/i.test(s),rgb=(id,fallback)=>{let s=$(id).value;return valid(s)?[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)).join(','):fallback};$('play').textContent=playing?'Pause':'Play';$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
function point(u,i,n){const k=i/(n-1),gap=+$('gap').value,h=+$('height').value;const center=555+52*Math.sin(u*6.28-.6)*h;const spread=(110+430*Math.pow(u,1.7))*gap;return [u*1760-80,center+(k-.5)*spread+Math.sin(u*7.2+k*1.7)*65*h];}
for(const id of ['color','highlight','bg1','bg2']){const picker=$(id+'Picker');picker.oninput=()=>{$(id).value=picker.value.toUpperCase()};$(id).oninput=()=>{if(valid($(id).value))picker.value=$(id).value}}$('rotation').oninput=()=>{$('rotationValue').textContent=$('rotation').value+'°'};$('gap').oninput=()=>{$('gapValue').textContent=Number($('gap').value).toFixed(2).replace(/0$/,'').replace(/\.$/,'')+'×'};
for(const id of ['positionX','positionY'])$(id).oninput=()=>{$(id+'Value').textContent=$(id).value+'%'};
$('resetPosition').onclick=()=>{for(const id of ['positionX','positionY']){$(id).value=0;$(id).dispatchEvent(new Event('input'))}};
$('thickness').oninput=()=>{$('thicknessValue').textContent=Number($('thickness').value)+' px'};
function frame(now,exactTime){if(window.flowRendering&&exactTime===undefined){requestAnimationFrame(frame);return;}if(last&&playing&&!document.hidden)t+=Math.min((now-last)/1000,.05);last=now;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.scale(canvas.width/1600,canvas.height/900);if($('bg').value!=='transparent'&&!window.flowPortraitCompositing){let g=ctx.createLinearGradient(0,0,0,900),a=valid($('bg1').value)?$('bg1').value:'#184CD0',b=valid($('bg2').value)?$('bg2').value:'#82B2F5';g.addColorStop(0,a);g.addColorStop(1,$('bg').value==='solid'?a:b);ctx.fillStyle=g;ctx.fillRect(0,0,1600,900)}else canvas.style.background='repeating-conic-gradient(#243147 0% 25%,#182337 0% 50%) 0/24px 24px';ctx.save();ctx.translate(+$('positionX').value*16,+$('positionY').value*9);ctx.translate(800,450);ctx.rotate(+$('rotation').value*Math.PI/180);ctx.translate(-800,-450);if($('mirror').checked){ctx.translate(1600,0);ctx.scale(-1,1)}const duration=Number($('portrait-duration')?.value||6),cycles=Math.max(1,Math.round(duration*+$('speed').value/6)),loopTime=exactTime===undefined?t:exactTime,phaseTime=((loopTime/duration*cycles)%1+1)%1;
const n=+$('density').value,base=rgb('color','24,123,223'),light=rgb('highlight','56,230,242'),thickness=+$('thickness').value,glow=+$('glow').value,dir=$('reverse').checked?-1:1;
for(let i=0;i<n;i++){
 ctx.lineWidth=thickness*(.65+i/n);ctx.strokeStyle=`rgba(${base},${.38+.3*i/n})`;ctx.shadowColor=`rgba(${base},.7)`;ctx.shadowBlur=glow*8;ctx.beginPath();
 for(let j=0;j<=220;j++){const p=point(j/220,i,n);j?ctx.lineTo(...p):ctx.moveTo(...p)}ctx.stroke();ctx.shadowBlur=0;
 for(let j=0;j<18;j++){const u=((j/18+phaseTime*dir+i*.008)%1+1)%1,p=point(u,i,n);const brightness=.25+.65*Math.pow(.5+.5*Math.cos(u*Math.PI*2-phaseTime*Math.PI*2+i*.12),4);ctx.fillStyle=`rgba(${light},${brightness})`;ctx.shadowColor=`rgba(${light},.8)`;ctx.shadowBlur=glow*9;ctx.beginPath();ctx.arc(...p,thickness*(.75+i/n*.35),0,Math.PI*2);ctx.fill();}
 ctx.shadowBlur=0;
 const phase=((phaseTime*dir+i*.012)%1+1)%1;
 for(let j=0;j<30;j++){const u=((phase-j*.004*dir)%1+1)%1;ctx.strokeStyle=`rgba(${light},${.65*(1-j/30)})`;ctx.lineWidth=thickness*1.5;ctx.beginPath();ctx.moveTo(...point(u,i,n));ctx.lineTo(...point(u+.005*dir,i,n));ctx.stroke();}
}
ctx.restore();if(exactTime===undefined)requestAnimationFrame(frame)}window.flowRenderAt=seconds=>frame(performance.now(),seconds);requestAnimationFrame(frame);
</script></html>
