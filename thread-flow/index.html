<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thread Flow</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#edf5ff;font:15px system-ui}header,footer{padding:22px 4vw;display:flex;align-items:center;gap:18px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:20px;margin:0}p{font-size:13px;color:#adc0d9;margin:6px 0}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9}button,select,input[type=text]{font:inherit;background:#172b49;color:inherit;border:1px solid #456082;border-radius:7px;padding:9px}input[type=text]{width:100px}input[type=range]{width:105px;accent-color:#80dfff}input[type=color]{width:36px;height:34px;padding:0;border:0;background:none}output{min-width:38px;font-variant-numeric:tabular-nums}label{display:flex;align-items:center;gap:8px}footer{justify-content:center}a{color:#bddcff}</style><header><div><h1>Thread Flow</h1><p>Fine crossing curves · traveling highlights · inspired by Mintlify</p></div><button id="play">Pause</button></header><main><canvas width="1600" height="900" aria-label="Fine blue threads with highlights traveling left to right"></canvas></main><footer><label>Speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><label>Threads <input id="density" type="range" min="8" max="40" value="24" step="1"></label><label>Rotation <input id="rotation" aria-label="Thread rotation" type="range" min="-180" max="180" step="1" value="0"><output id="rotationValue">0°</output></label><label>Spacing <input id="gap" aria-label="Thread gap" type="range" min="0.2" max="3" step="0.05" value="1"><output id="gapValue">1×</output></label><label>Spread <input id="spread" aria-label="Overall spread" type="range" min="80" max="800" step="10" value="420"><output id="spreadValue">420</output></label><label>Minimum gap <input id="minGap" aria-label="Minimum thread gap" type="range" min="0" max="30" step="1" value="10"><output id="minGapValue">10 px</output></label><label>Crossing <input id="crossing" aria-label="Crossing amount" type="range" min="0" max="1" step=".05" value="0.15"><output id="crossingValue">15%</output></label><label>Thickness <input id="thickness" aria-label="Line thickness" type="range" min="0.5" max="8" step="0.1" value="1"><output id="thicknessValue">1 px</output></label><label>Line <input id="colorPicker" aria-label="Line color picker" type="color" value="#70dfff"><input id="color" type="text" value="#70DFFF" maxlength="7"></label><label>Highlight <input id="highlightPicker" aria-label="Highlight color picker" type="color" value="#e1faff"><input id="highlight" type="text" value="#E1FAFF" maxlength="7"></label><label>Background <select id="bg"><option value="gradient">Gradient</option><option value="solid">Solid</option><option value="transparent">Transparent</option></select></label><input id="bg1Picker" aria-label="Background start color picker" type="color" value="#184cd0"><input id="bg1" aria-label="Background start hex" type="text" value="#184CD0" maxlength="7"><input id="bg2Picker" aria-label="Background end color picker" type="color" value="#82b2f5"><input id="bg2" aria-label="Background end hex" type="text" value="#82B2F5" maxlength="7"><label><input id="reverse" type="checkbox">Reverse</label><label><input id="mirror" type="checkbox">Mirror</label><a href="../flow-library/index.html">Flow library</a></footer><script src="../flow-library/shared/portrait.js?v=library-actions1"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let t=0,last=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches;const valid=s=>/^#[0-9a-f]{6}$/i.test(s),rgb=(id,fallback)=>{let s=$(id).value;return valid(s)?[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)).join(','):fallback};$('play').textContent=playing?'Pause':'Play';$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
function point(u,i,n){let k=i/(n-1)-.5,gap=+$('gap').value,spread=+$('spread').value,minGap=+$('minGap').value*(n-1),cross=+$('crossing').value;let v=1-u;let center=v*v*v*770+3*v*v*u*580+3*v*u*u*350+u*u*u*210;let separation=Math.max(minGap,spread*(.65+.35*Math.cos(u*Math.PI*2)))*gap;let weave=Math.sin(u*Math.PI*2+i*.52)*cross*100*Math.sin(Math.PI*u);return [v*v*v*(-180)+3*v*v*u*420+3*v*u*u*1080+u*u*u*1780,center+k*separation+weave]}
for(const id of ['color','highlight','bg1','bg2']){const picker=$(id+'Picker');picker.oninput=()=>{$(id).value=picker.value.toUpperCase()};$(id).oninput=()=>{if(valid($(id).value))picker.value=$(id).value}}$('rotation').oninput=()=>{$('rotationValue').textContent=$('rotation').value+'°'};$('gap').oninput=()=>{$('gapValue').textContent=Number($('gap').value).toFixed(2).replace(/0$/,'').replace(/\.$/,'')+'×'};
for(const id of ['spread','minGap','crossing'])$(id).oninput=()=>{$(id+'Value').textContent=id==='crossing'?Math.round(+$(id).value*100)+'%':$(id).value+(id==='minGap'?' px':'')};
$('thickness').oninput=()=>{$('thicknessValue').textContent=Number($('thickness').value)+' px'};
function frame(now){if(last&&playing&&!document.hidden)t+=Math.min((now-last)/1000,.05)*+$('speed').value;last=now;ctx.clearRect(0,0,1600,900);if($('bg').value!=='transparent'&&!window.flowPortraitCompositing){let g=ctx.createLinearGradient(0,0,0,900),a=valid($('bg1').value)?$('bg1').value:'#184CD0',b=valid($('bg2').value)?$('bg2').value:'#82B2F5';g.addColorStop(0,a);g.addColorStop(1,$('bg').value==='solid'?a:b);ctx.fillStyle=g;ctx.fillRect(0,0,1600,900)}else canvas.style.background='repeating-conic-gradient(#243147 0% 25%,#182337 0% 50%) 0/24px 24px';ctx.save();ctx.translate(800,450);ctx.rotate(+$('rotation').value*Math.PI/180);ctx.translate(-800,-450);if($('mirror').checked){ctx.translate(1600,0);ctx.scale(-1,1)}let n=+$('density').value,base=rgb('color','112,223,255'),highlight=rgb('highlight','225,250,255');const thickness=+$('thickness').value;ctx.lineWidth=thickness;for(let i=0;i<n;i++){ctx.strokeStyle=`rgba(${base},${.18+.16*(i%3)/2})`;ctx.beginPath();for(let j=0;j<=160;j++){let p=point(j/160,i,n);j?ctx.lineTo(...p):ctx.moveTo(...p)}ctx.stroke();let phase=(t/9*($('reverse').checked?-1:1)+i*.137)%1;if(phase<0)phase+=1;for(let j=0;j<22;j++){let u=phase-j*.0018*($('reverse').checked?-1:1);if(u<0||u>1)continue;let next=u+.002*($('reverse').checked?-1:1);ctx.strokeStyle=`rgba(${highlight},${(1-j/22)*.9})`;ctx.lineWidth=thickness*1.7;ctx.beginPath();ctx.moveTo(...point(u,i,n));ctx.lineTo(...point(next,i,n));ctx.stroke()}ctx.lineWidth=thickness}ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
